# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = notify-send "Locking..."   # This is a placeholder, it will not run
    unlock_cmd = notify-send "Unlocked!" # This is a placeholder
    ignore_dbus_inhibit = false          # Recommended to keep false
}

# Turn off monitors after 15 minutes
listener {
    timeout = 900                                # 15 minutes
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; systemctl --user restart waybar.service
}
